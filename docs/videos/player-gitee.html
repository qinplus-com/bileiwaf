<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>壁垒WAF · 产品演示（Gitee 绝对切片）</title>
<style>
  :root{
    --bg:#070b12; --panel:#0d1626; --line:#1c2b42;
    --text:#e8eef8; --muted:#94a6bf; --accent:#4da3ff;
  }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%}
  body{
    background:radial-gradient(1200px 600px at 50% -10%,#12203a 0%,var(--bg) 60%);
    color:var(--text);
    font-family:"Microsoft YaHei","PingFang SC",system-ui,sans-serif;
    display:flex;flex-direction:column;min-height:100vh;
  }
  header{
    display:flex;align-items:center;justify-content:space-between;
    padding:18px 32px;border-bottom:1px solid var(--line);
  }
  .brand{display:flex;align-items:center;gap:12px}
  .logo{height:44px;width:auto;display:block}
  .brand b{font-size:19px;letter-spacing:.5px}
  .brand span{color:var(--muted);font-size:13px;margin-left:6px}
  .meta{color:var(--muted);font-size:13px}
  main{flex:1;width:100%;max-width:1280px;margin:0 auto;padding:28px 24px}
  .stage{
    position:relative;background:#000;border:1px solid var(--line);
    border-radius:14px;overflow:hidden;box-shadow:0 24px 60px rgba(0,0,0,.55);
    aspect-ratio:16/9;
  }
  video{width:100%;height:100%;display:block;background:#000}
  .loading{
    position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
    background:rgba(5,9,16,.72);font-size:14px;color:var(--muted);
    transition:opacity .4s;pointer-events:none;
  }
  .loading.hide{opacity:0}
  .ring{
    width:30px;height:30px;border:3px solid #24354f;border-top-color:var(--accent);
    border-radius:50%;animation:spin 1s linear infinite;margin-right:12px;
  }
  @keyframes spin{to{transform:rotate(360deg)}}
  .error{
    display:none;margin-top:14px;padding:14px 16px;border-radius:10px;
    background:#2a1215;border:1px solid #5a2026;color:#ffb4b4;font-size:14px;
    line-height:1.7;white-space:pre-wrap;
  }
  .bar{
    display:flex;align-items:center;gap:14px;flex-wrap:wrap;
    margin-top:16px;padding:14px 18px;background:var(--panel);
    border:1px solid var(--line);border-radius:12px;
  }
  .bar label{color:var(--muted);font-size:13px}
  select,button{
    background:#12203a;color:var(--text);border:1px solid #26395a;
    border-radius:8px;padding:7px 12px;font-size:13px;cursor:pointer;
    font-family:inherit;
  }
  select:hover,button:hover{border-color:var(--accent)}
  .spacer{flex:1}
  .keys{color:var(--muted);font-size:12px}
  kbd{
    background:#14233a;border:1px solid #293d5c;border-radius:5px;
    padding:1px 6px;font-family:Consolas,monospace;font-size:11px;color:#c8d6ea;
  }
  .src{
    margin-top:12px;padding:12px 16px;background:var(--panel);border:1px solid var(--line);
    border-radius:10px;font-size:12px;color:var(--muted);line-height:1.8;word-break:break-all;
  }
  .src b{color:var(--text)}
  .src code{color:#9cc4ff;font-family:Consolas,monospace}
  footer{
    padding:26px 32px;border-top:1px solid var(--line);
    color:var(--muted);font-size:13px;display:flex;justify-content:space-between;
    flex-wrap:wrap;gap:10px;
  }
  footer a{color:var(--accent);text-decoration:none}
  @media (max-width:640px){
    header{padding:14px 16px}
    main{padding:16px 12px}
    .keys{display:none}
  }
</style>
</head>
<body>
<header>
  <div class="brand">
    <img class="logo" src="https://gitee.com/qinpluscom/bileiwaf/raw/main/docs/videos/poster.jpg" alt="壁垒WAF" style="height:34px;border-radius:4px">
    <span>产品演示</span>
  </div>
  <div class="meta">内蒙古勤加软件有限公司</div>
</header>

<main>
  <div class="stage">
    <video id="player" controls playsinline preload="metadata"></video>
    <div class="loading" id="loading"><div class="ring"></div>正在加载视频切片…</div>
  </div>

  <div class="bar">
    <label for="source">播放源</label>
    <select id="source">
      <option value="gitee" selected>Gitee（绝对切片）</option>
      <option value="github">GitHub（备用）</option>
    </select>
    <label for="quality">画质</label>
    <select id="quality"><option value="-1">自动</option></select>
    <label for="speed">倍速</label>
    <select id="speed">
      <option value="0.75">0.75×</option>
      <option value="1" selected>1×</option>
      <option value="1.25">1.25×</option>
      <option value="1.5">1.5×</option>
      <option value="2">2×</option>
    </select>
    <button id="fullscreen">全屏</button>
  </div>

  <div class="src" id="srcline"></div>
  <div class="error" id="error"></div>
</main>

<footer>
  <div>壁垒WAF · Web 应用防火墙　<a href="https://bileiwaf.com" target="_blank" rel="noopener">bileiwaf.com</a></div>
  <div>HLS 自适应切片 · 4K / 1080p</div>
</footer>

<script src="https://cdn.jsdelivr.net/npm/hls.js@1.5.17/dist/hls.min.js"></script>
<script>
(function () {
  var video = document.getElementById('player');
  var loading = document.getElementById('loading');
  var errBox = document.getElementById('error');
  var srcline = document.getElementById('srcline');
  var sourceSel = document.getElementById('source');
  var quality = document.getElementById('quality');
  var speed = document.getElementById('speed');
  var fullscreen = document.getElementById('fullscreen');

  /* 切片与清单均为绝对路径；换域名/换目录部署时无需改动切片 */
  var SOURCES = {
    gitee:  'https://gitee.com/qinpluscom/bileiwaf/raw/main/docs/videos/master-gitee.m3u8',
    github: 'https://raw.githubusercontent.com/qinplus-com/bileiwaf/main/docs/videos/master-github.m3u8'
  };
  var POSTER = 'https://gitee.com/qinpluscom/bileiwaf/raw/main/docs/videos/poster.jpg';

  var hls = null;
  var autoSwitched = false;

  video.poster = POSTER;

  function showError(msg) {
    errBox.style.display = 'block';
    errBox.textContent = msg;
    loading.classList.add('hide');
  }
  function clearError() {
    errBox.style.display = 'none';
    errBox.textContent = '';
  }

  function load(key) {
    clearError();
    loading.classList.remove('hide');
    if (hls) { hls.destroy(); hls = null; }
    quality.innerHTML = '<option value="-1">自动</option>';
    srcline.innerHTML = '清单：<code>' + SOURCES[key] + '</code>';

    var src = SOURCES[key];

    if (window.Hls && Hls.isSupported()) {
      hls = new Hls({
        enableWorker: true,
        lowLatencyMode: false,
        backBufferLength: 90,
        maxBufferLength: 60
      });
      hls.loadSource(src);
      hls.attachMedia(video);

      hls.on(Hls.Events.MANIFEST_PARSED, function (e, data) {
        loading.classList.add('hide');
        data.levels.forEach(function (lv, i) {
          var name = lv.height >= 2160 ? '4K (2160p)' : lv.height + 'p';
          var opt = document.createElement('option');
          opt.value = i;
          opt.textContent = name;
          quality.appendChild(opt);
        });
      });

      hls.on(Hls.Events.LEVEL_SWITCHED, function (e, data) {
        var lv = hls.levels[data.level];
        if (lv && document.activeElement !== quality) quality.value = String(data.level);
      });

      hls.on(Hls.Events.ERROR, function (e, data) {
        if (!data.fatal) return;
        if (data.type === Hls.ErrorTypes.NETWORK_ERROR) {
          if (key === 'gitee' && !autoSwitched) {
            autoSwitched = true;
            sourceSel.value = 'github';
            showError('Gitee 源加载失败（Gitee 原始文件仅对 gitee.com 域开放 CORS，Chrome/Edge 下会被浏览器拦截）。\n已自动切换到 GitHub 源。');
            load('github');
            return;
          }
          showError('网络错误，无法加载切片文件。\n请确认切片已推送到对应仓库，或改用与页面同域的切片地址。');
          hls.startLoad();
        } else if (data.type === Hls.ErrorTypes.MEDIA_ERROR) {
          showError('解码错误，正在尝试恢复…');
          hls.recoverMediaError();
        } else {
          showError('播放失败：' + data.details);
          hls.destroy();
        }
      });
    } else if (video.canPlayType('application/vnd.apple.mpegurl')) {
      /* Safari / iOS 原生 HLS，不受跨域 CORS 限制 */
      video.src = src;
      video.addEventListener('loadedmetadata', function () { loading.classList.add('hide'); }, { once: true });
    } else {
      showError('当前浏览器不支持 HLS 播放，请使用 Chrome / Edge / Firefox 最新版。');
    }
  }

  sourceSel.addEventListener('change', function () {
    autoSwitched = true;   /* 手动选择后不再自动切源 */
    load(sourceSel.value);
  });

  quality.addEventListener('change', function () {
    if (!hls) return;
    hls.currentLevel = parseInt(quality.value, 10);
  });

  speed.addEventListener('change', function () {
    video.playbackRate = parseFloat(speed.value);
  });

  fullscreen.addEventListener('click', function () {
    if (video.requestFullscreen) video.requestFullscreen();
    else if (video.webkitRequestFullscreen) video.webkitRequestFullscreen();
  });

  document.addEventListener('keydown', function (ev) {
    if (ev.target.tagName === 'SELECT' || ev.target.tagName === 'INPUT') return;
    var k = ev.key.toLowerCase();
    if (k === ' ') {
      ev.preventDefault();
      video.paused ? video.play() : video.pause();
    } else if (k === 'arrowright') {
      video.currentTime = Math.min(video.duration || 0, video.currentTime + 5);
    } else if (k === 'arrowleft') {
      video.currentTime = Math.max(0, video.currentTime - 5);
    } else if (k === 'f') {
      fullscreen.click();
    } else if (k === 'm') {
      video.muted = !video.muted;
    }
  });

  video.addEventListener('waiting', function () { loading.classList.remove('hide'); });
  video.addEventListener('playing', function () { loading.classList.add('hide'); });

  load('gitee');
})();
</script>
</body>
</html>
