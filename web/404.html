<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>壁垒WAF 安全防护</title>
<meta name="robots" content="noindex, nofollow">
<link rel="icon" href="/images/favicon.ico" type="image/x-icon">
<style>
*{box-sizing:border-box}
body{margin:0;min-height:100vh;background:#0b1220;color:#d8e4f5;
  font:14px/1.75 -apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif}
.adlayer{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;padding:24px}
.hint{position:absolute;left:0;right:0;bottom:18px;text-align:center;font-size:11px;color:#5b6d85}
.promo{max-width:520px;padding:0 8px;text-align:center}
.promo .p-brand{color:#22d3ee;font-weight:700;letter-spacing:2px;font-size:13px;margin-bottom:8px}
.promo .p-pitch{font-size:17px;font-weight:700;margin-bottom:12px}
.promo .p-list{list-style:none;margin:0 0 16px;padding:0;font-size:12px;color:#8296ad;line-height:2.1}
.promo .p-cta{display:inline-block;padding:9px 18px;border:1px solid #22d3ee;border-radius:9px;
  background:#0f2b45;color:#9fe8f6;font-size:13px;text-decoration:none}
.mask{position:fixed;inset:0;background:rgba(3,8,18,.72);backdrop-filter:blur(2px)}
.modal{position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);width:min(500px,92vw);
  padding:28px 26px;border:1px solid #1c2f4d;border-radius:16px;
  background:linear-gradient(160deg,#12233f,#0d1a2e);box-shadow:0 24px 64px rgba(0,0,0,.6)}
.modal .brand{color:#22d3ee;font-weight:700;letter-spacing:2px;font-size:13px}
.modal .site{color:#7fa6d0;font-size:12px;word-break:break-all;margin-top:2px}
.notfound{margin-top:12px;font-size:14px;color:#c3d3e6}
.modal .lead{margin:14px 0 0;font-size:15px;font-weight:600;color:#d8e4f5}
.acts{display:flex;gap:10px;margin-top:16px;flex-wrap:wrap}
.btn{flex:1;min-width:140px;text-align:center;padding:9px 14px;border-radius:9px;border:1px solid #22d3ee;
  background:#0f2b45;color:#9fe8f6;font-size:13px;text-decoration:none;cursor:pointer;font-family:inherit}
.btn.ghost{border-color:#294260;background:transparent;color:#9fb3ca}
</style>
</head>
<body>
<div class="adlayer">
  <div class="promo">
    <div class="p-brand">壁垒WAF</div>
    <div class="p-pitch">网站安全防护，部署即生效</div>
    <ul class="p-list">
      <li>实时拦截 SQL 注入、XSS、命令注入等 OWASP 威胁</li>
      <li>CC 攻击与恶意爬虫限流，清洗虚假流量</li>
      <li>攻击态势大屏与规则命中分析，5 分钟完成接入</li>
    </ul>
    <a class="p-cta" href="https://bileiwaf.com" rel="noopener">了解 bileiwaf.com →</a>
  </div>
  <div class="hint">本站由 壁垒WAF 提供安全防护</div>
</div>
<div class="mask" id="bwMask"></div>
<div class="modal" id="bwModal" role="dialog" aria-modal="true" aria-label="BILEI WAF 提供技术支持">
  <div class="brand">BILEI WAF 提供技术支持</div>
  <div class="site">bileiwaf.com</div>
  <div class="notfound">您访问的页面没有找到</div>
  <p class="lead">网站安全防护，部署即生效</p>
  <div class="acts">
    <a class="btn" href="https://bileiwaf.com" rel="noopener">访问 bileiwaf.com</a>
    <button class="btn ghost" type="button" onclick="document.getElementById('bwMask').style.display='none';document.getElementById('bwModal').style.display='none'">继续浏览</button>
  </div>
</div>
</body>
</html>
