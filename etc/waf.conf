# 壁垒WAF 主配置（make install 安装到 $PREFIX/config/waf.conf）
# 现场已存在时升级不会覆盖本文件。

# 工作线程数（高并发生产可上调至 32/64，或 systemd 设 WAF_WORKER_THREADS）
worker_threads = 8

# 检测模式: rules(纯规则) | ai(纯AI) | auto(级联：规则先判，未拦走 AI)
#   rules — 仅规则引擎，确定性最高，生产默认
#   ai    — 仅 AI 双通道模型（char-CNN 监督 + autoencoder 自监督，
#           models/ai_cnn.dat / ai_ae.dat / ai_fusion.dat）；
#           模型缺失时自动回退规则引擎兜底（fail-safe）
#   auto  — 级联：规则引擎先判，命中即拦；未命中的流量再走 AI 双通道。
#           已知攻击走规则毫秒级快速路径，AI 专注规则漏检与 0day 异常。
#           （v1.1.0 为"AI 先判"并集语义，v1.2.0 起改为级联）
# 切换模式后需重启数据平面生效。
detection_mode = auto

# ---- AI 检测调优（detection_mode = ai / auto 时生效）----
# AI 融合决策阈值（0.0~1.0，越高越保守；默认沿用 models/ai_fusion.dat 校准值）
# ai_ensemble_threshold = 0.98
# CNN 通道融合权重（0.0~1.0；默认沿用 ai_fusion.dat 校准值，AE 权重=校准 w_ae）
# ai_cnn_weight = 0.9
# 影子模式：on 时 AI 只打分写日志（logs/ai-shadow.log）不拦截，用于灰度验证
# ai_shadow_mode = off
# 护栏自主学习：AI 高分但规则未拦截的载荷自动聚类铸造新规则（AILEARN），
# 铸造前会对 ai_white_list 全量评估，产生任何误报即拒绝
# ai_guard_enabled = off
# ai_white_list = /tmp/white_all.txt
# ai_learned_rules = rules/ai_learned.rules

# HTTP / HTTPS 端口（可被 start.sh -p/-s 覆盖，CLI 显式参数优先）
http_port = 80
https_port = 443

# ---- IP 地理定位（管理大屏「攻击来源」）----
# MMDB 格式 IP 库（libmaxminddb 读取）。大屏按 IP 归属地展示来源国家/城市，
# 世界地图按经纬度打点。自动降级顺序：
#   1. 本键指定的文件
#   2. $WAF_HOME/geoip/GeoLite2-City.mmdb
#   3. $WAF_HOME/geoip/GeoLite2-Country.mmdb（仅国家，无城市/坐标）
# 三者皆无时来源显示为「—」，不影响防护功能。
# 数据文件不打进发行包（体积大），部署时自备放入；如 MaxMind GeoLite2。
# geoip_db = geoip/GeoLite2-City.mmdb

# 默认后端（可被 start.sh -b 覆盖）
backend_host = 127.0.0.1
backend_port = 9000

# 日志与规则目录（相对 $PREFIX / WAF_HOME）
log_dir = logs
rules_dir = rules

# ---- 日志轮转与保留 ----
# 单个日志文件达到该大小（MB）即轮转为 waf-xxx.log.YYYYmmdd-HHMMSS 并继续写入；
# 设为 0 关闭按大小轮转（仍可用 ./waf rotate 手动轮转）
log_rotate_size = 50
# 轮转归档保留天数，超过后自动删除；设为 0 永久保留
log_retention_days = 30

# HTTPS 证书：首次执行 start.sh 时若文件不存在会自动生成自签证书；
# 生产环境请替换为正式证书路径后重启。
cert_file = certs/server.pem
key_file = certs/server.key

# 工作模式: learning | detection | blocking
mode = blocking

# 管理平面端口（管理后台/监控大屏独立监听；0 或缺省 = 不开启独立管理平面）
admin_port = 19000
