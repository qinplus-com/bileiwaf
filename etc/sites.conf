# 壁垒WAF 站点主配置（安装到 $PREFIX/config/sites.conf）
[global]
http_port = 80
https_port = 443
worker_threads = 8
mode = blocking
log_dir = logs
rules_dir = rules
enable_cc_protection = 1
enable_api_protection = 1
enable_bot_detection = 1

[cache]
enabled = 0
type = memory
max_size = 512
expire_time = 3600

[optimization]
gzip_enabled = 1
request_timeout = 30
keepalive_timeout = 60

[security]
csrf_protection = 1
xss_protection = 1
clickjacking_protection = 1

[sites]
# 每行一个 etc/sites（安装后 config/sites）下的站点文件
site = demo.local.conf
