# ============================================================
# 403 拦截页 / 广告位配置（壁垒WAF）
#
# 生效方式：./waf restart     或     kill -HUP <数据平面 PID> 热加载
# 说明：被拦截的请求仍返回 HTTP 403；本配置只影响响应正文。
# 注意：广告仅面向「浏览器类」客户端展示调用方判断，API/JSON 请求仍返回
#       JSON 错误体，避免污染接口语义（见 waf.c 的 Accept 协商）。
# ============================================================

# 1=启用可配置拦截页；0=回退到内置极简 403（默认行为）
enabled = 1

# 页面形态：simple=单卡片 | modal=品牌弹窗（弹窗覆盖在上层，广告铺在底层）
style = modal

# 弹窗文案与按钮链接（modal 形态生效）
modal_title = BILEI WAF 提供技术支持
modal_site  = bileiwaf.com
modal_link  = https://bileiwaf.com

# 是否注入广告位：1=开 0=关。默认关闭。
# 定位说明：403 页几乎只有扫描器会看到，实际用途是为 bileiwaf.com 做品牌宣传 /
# 引流；ad_enabled=0 时弹窗背后的底层自动显示产品宣传板（不是空白页）。
ad_enabled = 0

# 仅对浏览器 UA 展示广告：1=开（默认）。扫描器/curl 等命中不给广告，
# 避免无效曝光（多数广告联盟把此类流量判为 IVT 无效流量并扣量/封号）
ad_browser_only = 1

# 「继续浏览」是否需要人机验证：1=跳转 /waf-captcha 验证后才放行 0=仅关闭弹窗
# 开启后验证通过的来源 IP 在放行 cookie 有效期内（默认 300 秒）不会被拦截页拦下，
# 便于误报用户继续访问；黑名单 IP 不参与放行。
verify = 1

# 广告形式：none | banner | iframe | script
#   banner —— 自己的图片广告（ad_image + ad_link）
#   iframe —— 第三方广告平台提供的 iframe 广告位
#   script —— 第三方广告 JS 片段（ad_script_file 指向本地片段文件）
ad_mode = banner

# ---- banner 模式 ----
# 图片与跳转都必须 http/https；跳转仅允许 http/https，防止 javascript: 注入
ad_image = https://demo.bileiwaf.com/images/ad-728x90.png
ad_link  = https://bileiwaf.com/?from=waf403
ad_alt   = 壁垒WAF — Web 应用防火墙

# ---- iframe 模式 ----
# ad_iframe = https://ads.example.com/slot?id=waf403

# ---- script 模式（第三方广告 JS 片段，相对 WAF_HOME 或绝对路径）----
# ad_script_file = pages/ad_snippet.html

# 自定义模板（可选）：支持 {{ip}} {{rule}} {{url}} {{time}} {{ad}} 占位符
# 相对路径基于 WAF_HOME；留空使用内置模板
# template = pages/403.html
