# 默认演示/兜底站点
# 未匹配任何站点域名的 Host 头，统一代理到本机默认后端（start.sh -b，默认 9000）。
# 接入真实业务：复制本文件为 <域名>.conf，修改 domain/backend，
# 再在 sites.conf 的 [sites] 中追加一行 site = <域名>.conf。

[site]
domain = demo.local
domains = demo.local,localhost
document_root = web
backend_host = 127.0.0.1
backend_port = 9000
http_port = 80
https_port = 443
enabled = 1

[ssl]
# 站点独立证书留空时使用全局证书（waf.conf 的 cert_file/key_file，默认自签）
enabled = 1
cert_file =
key_file =

[logging]
enabled = 1
level = info
access_log = logs/demo.local/access.log
error_log = logs/demo.local/error.log
format = combined
max_file_size = 100
max_files = 3

[optimization]
worker_threads = 8
max_connections = 500
connection_timeout = 30
